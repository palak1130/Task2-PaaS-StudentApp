<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System | PaaS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }
        h1 { color: #174ea6; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }
        th { background: #174ea6; color: white; }
        tr:nth-child(even) { background: #f2f6fc; }
        .note { color: #555; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Information System</h1>
        <p>Welcome to our cloud-hosted student portal!</p>

        <table>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Department</th>
            </tr>
            <tr>
                <td>101</td>
                <td>Student A</td>
                <td>Computer Science</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Student B</td>
                <td>Information Technology</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Student C</td>
                <td>Electronics</td>
            </tr>
        </table>

        <p class="note">Deployed using Platform as a Service (PaaS).</p>
    </div>
</body>
</html>
